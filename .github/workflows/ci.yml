name: CI

# Τεστ σε κάθε PR προς staging/main και σε κάθε push στο staging και στο main (GAME-STANDARD, fleet conventions):
# actions καρφωμένα σε SHA, token μόνο για ανάγνωση, gitleaks με έλεγχο checksum.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2   # coverage-floor-check.sh compares with the base branch (HEAD^1 on staging/main pushes)
      - name: Coverage floor not lowered (TEST-STANDARD v1 §R; floor = test count in .coverage-floor)
        run: bash tools/coverage-floor-check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Node tests (tests/*.test.mjs)
        run: node --test tests/*.test.mjs
      - name: Python syntax check
        run: git ls-files -z '*.py' | xargs -0 python3 -m py_compile
      - name: Python tests (standard library unittest)
        run: python3 -m unittest discover -s tests -v
      - name: shellcheck tools/*.sh (preinstalled on ubuntu-latest)
        run: shellcheck tools/*.sh

  # Playwright (test-only, tests/ui): index.html under the hub CSP at /konstantinos/, keyboard quiz, tap, axe.
  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install Playwright (tests/ui only, the game needs nothing)
        run: cd tests/ui && npm ci && npx playwright install --with-deps chromium
      - name: Playwright smoke + axe
        run: cd tests/ui && npx playwright test
      - name: Test count >= floor (.coverage-floor = node + python + playwright)
        run: bash tools/test-count-check.sh
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ github.sha }}
          path: tests/ui/test-results/
          retention-days: 14

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks && sudo install -m 0755 gitleaks /usr/local/bin/gitleaks && rm -f gitleaks "$f"
      - name: Gate - fail on any finding
        run: gitleaks detect --source=. --redact --no-banner
